<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOPTIK - Vidiyoo Fe'i</title>
  <!-- Firebase App & Firestore SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .upload-card {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      text-align: center;
      border: 1px solid #333;
    }
    h2 {
      font-size: 22px;
      margin-bottom: 20px;
      color: #fe2c55;
    }
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }
    input[type="file"], input[type="text"] {
      width: 100%;
      padding: 12px;
      background: #2c2c2c;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #fe2c55;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      word-break: break-word;
    }
    .info { background: #1a3a5c; color: #85c1e9; }
    .success { background: #1e4620; color: #82e0aa; }
    .error { background: #5c1a1a; color: #f1948a; }
  </style>
</head>
<body>

<div class="upload-card">
  <h2>TOPTIK - Vidiyoo Fe'i</h2>

  <div class="form-group">
    <label for="videoFile">Vidiyoo Filadhu:</label>
    <input type="file" id="videoFile" accept="video/*">
  </div>

  <div class="form-group">
    <label for="videoCaption">Barreeffama (Caption):</label>
    <input type="text" id="videoCaption" placeholder="Mataduree ykn barreeffama galchi...">
  </div>

  <button type="button" id="uploadBtn">Post Video</button>

  <div id="status"></div>
</div>

<script>
  // Firebase Configuration
  const firebaseConfig = {
    projectId: "toptik-47f84"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  // Cloudinary Settings
  const CLOUD_NAME = "zkyyos4t";
  const UPLOAD_PRESET = "ml_default";

  // Elements
  const uploadBtn = document.getElementById('uploadBtn');
  const videoFileInput = document.getElementById('videoFile');
  const captionInput = document.getElementById('videoCaption');
  const statusDiv = document.getElementById('status');

  function showStatus(message, type) {
    statusDiv.style.display = 'block';
    statusDiv.className = type;
    statusDiv.innerText = message;
  }

  async function handleUpload() {
    const file = videoFileInput.files[0];
    const caption = captionInput.value.trim();

    if (!file) {
      showStatus("Mee dursa vidiyoo filadhu!", "error");
      return;
    }

    uploadBtn.disabled = true;
    showStatus("⏳ Vidiyoon Cloudinary irratti fe'amaa jira, mee eegi...", "info");

    try {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);

      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
        method: "POST",
        body: formData
      });

      const data = await response.json();

      if (!response.ok || !data.secure_url) {
        const errMsg = data.error ? data.error.message : "Upload failed";
        throw new Error("Cloudinary Error: " + errMsg);
      }

      showStatus("✅ Vidiyoon fe'ameera! Database irratti save gochaa jira...", "info");

      await db.collection("videos").add({
        videoUrl: data.secure_url,
        caption: caption,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        likes: 0
      });

      showStatus("🎉 Milkaa'ina: Vidiyoon kee post ta'eera!", "success");
      
      videoFileInput.value = "";
      captionInput.value = "";

    } catch (err) {
      console.error(err);
      showStatus("❌ " + err.message, "error");
    } finally {
      uploadBtn.disabled = false;
    }
  }

  uploadBtn.addEventListener('click', handleUpload);
</script>

</body>
</html>
