<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOPTIK - AI Video Editor & Upload</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .upload-card {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      border: 1px solid #333;
    }
    h2 {
      font-size: 22px;
      margin-bottom: 20px;
      color: #fe2c55;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }
    input[type="file"], input[type="text"], select {
      width: 100%;
      padding: 12px;
      background: #2c2c2c;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
    }
    .ai-options {
      background: #252525;
      padding: 12px;
      border-radius: 8px;
      border: 1px dashed #fe2c55;
      margin-bottom: 16px;
    }
    .ai-options h4 {
      font-size: 14px;
      color: #fe2c55;
      margin-bottom: 8px;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #fe2c55;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      word-break: break-word;
      text-align: center;
    }
    .info { background: #1a3a5c; color: #85c1e9; }
    .success { background: #1e4620; color: #82e0aa; }
    .error { background: #5c1a1a; color: #f1948a; }
  </style>
</head>
<body>

<div class="upload-card">
  <h2>✨ TOPTIK AI Video Editor</h2>

  <div class="form-group">
    <label for="videoFile">Vidiyoo Filadhu:</label>
    <input type="file" id="videoFile" accept="video/*">
  </div>

  <div class="form-group">
    <label for="videoCaption">Barreeffama (Caption):</label>
    <input type="text" id="videoCaption" placeholder="Mataduree galchi...">
  </div>

  <!-- AI Editing Tools Options -->
  <div class="ai-options">
    <h4>🤖 Filannoowwan AI Video Editing:</h4>
    
    <div class="checkbox-group">
      <input type="checkbox" id="aiCrop" checked>
      <label for="aiCrop">AI Smart Crop (Bifa TikTok 9:16)</label>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="aiOptimize" checked>
      <label for="aiOptimize">AI Quality & Fast Loading Optimizer</label>
    </div>

    <div class="form-group" style="margin-top: 8px; margin-bottom: 0;">
      <label for="aiFilter">AI Video Filter Addaa:</label>
      <select id="aiFilter">
        <option value="none">Normal (Filter Malee)</option>
        <option value="e_vignette:30">AI Vignette (Shadow Edges)</option>
        <option value="e_art:zorro">AI Art Filter</option>
        <option value="e_grayscale">Black & White</option>
      </select>
    </div>
  </div>

  <button type="button" id="uploadBtn">AI'n Sirreessi & Post Godhi</button>

  <div id="status"></div>
</div>

<script>
  const firebaseConfig = { projectId: "toptik-47f84" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const CLOUD_NAME = "zkyyos4t";
  const UPLOAD_PRESET = "ml_default";

  const uploadBtn = document.getElementById('uploadBtn');
  const videoFileInput = document.getElementById('videoFile');
  const captionInput = document.getElementById('videoCaption');
  const statusDiv = document.getElementById('status');

  function showStatus(message, type) {
    statusDiv.style.display = 'block';
    statusDiv.className = type;
    statusDiv.innerText = message;
  }

  // AI Transformation URL generator
  function applyAITransformations(originalUrl) {
    const aiCrop = document.getElementById('aiCrop').checked;
    const aiOptimize = document.getElementById('aiOptimize').checked;
    const aiFilter = document.getElementById('aiFilter').value;

    let transformations = [];

    if (aiCrop) {
      // AI Object/Face Detection Smart Crop (9:16 Vertical)
      transformations.push("c_fill,g_auto,w_720,h_1280");
    }
    if (aiOptimize) {
      // Auto Format & Fast Quality Optimization
      transformations.push("f_auto,q_auto");
    }
    if (aiFilter !== "none") {
      transformations.push(aiFilter);
    }

    if (transformations.length === 0) return originalUrl;

    const transformString = transformations.join(",");
    // URL Cloudinary keessa galchuu (/upload/ AFTER)
    return originalUrl.replace("/upload/", `/upload/${transformString}/`);
  }

  async function handleUpload() {
    const file = videoFileInput.files[0];
    const caption = captionInput.value.trim();

    if (!file) {
      showStatus("Mee dursa vidiyoo filadhu!", "error");
      return;
    }

    uploadBtn.disabled = true;
    showStatus("⏳ 1/2 Vidiyoon Cloudinary'tti fe'amaa jira...", "info");

    try {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);

      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
        method: "POST",
        body: formData
      });

      const data = await response.json();

      if (!response.ok || !data.secure_url) {
        throw new Error(data.error ? data.error.message : "Upload failed");
      }

      showStatus("🤖 2/2 AI'n vidiyoo gulaalaa fi Database irratti save gochaa jira...", "info");

      // Apply AI Video Editing transformations to URL
      const aiEditedVideoUrl = applyAITransformations(data.secure_url);

      await db.collection("videos").add({
        videoUrl: aiEditedVideoUrl,
        rawUrl: data.secure_url,
        caption: caption,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        likes: 0
      });

      showStatus("🎉 Milkaa'ina: Vidiyoon AI'n gulaalamee post ta'eera!", "success");
      
      videoFileInput.value = "";
      captionInput.value = "";

    } catch (err) {
      console.error(err);
      showStatus("❌ Error: " + err.message, "error");
    } finally {
      uploadBtn.disabled = false;
    }
  }

  uploadBtn.addEventListener('click', handleUpload);
</script>

</body>
</html>
