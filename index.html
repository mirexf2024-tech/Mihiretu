<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOPTIK - Vidiyoo Fe'i</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; padding: 20px; text-align: center; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; max-width: 400px; margin: 40px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    input, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: none; box-sizing: border-box; font-size: 15px; }
    input[type="file"] { background: #2a2a2a; color: #ccc; }
    input[type="text"] { background: #2a2a2a; color: white; }
    button { background: #fe2c55; color: white; font-weight: bold; cursor: pointer; }
    button:active { background: #e02447; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Vidiyoo Fe'i (TOPTIK)</h2>
    <input type="file" id="videoFile" accept="video/*">
    <input type="text" id="videoCaption" placeholder="Barreeffama (Caption) galchi...">
    <button type="button" onclick="handlePost()">Post Video</button>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      projectId: "toptik-47f84"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    async function handlePost() {
      alert("1. Button cuqaasameera!");

      const fileInput = document.getElementById('videoFile');
      const captionInput = document.getElementById('videoCaption');

      if (!fileInput || !fileInput.files[0]) {
        alert("Mee dursa vidiyoo filadhu!");
        return;
      }

      const file = fileInput.files[0];
      const caption = captionInput ? captionInput.value : "";

      alert("2. Vidiyoon Cloudinary'tti fe'amaa jira, mee eegi...");

      try {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", "ml_default");

        const response = await fetch("https://api.cloudinary.com/v1_1/zkyyos4t/video/upload", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (response.ok && data.secure_url) {
          alert("3. Vidiyoon Cloudinary irratti fe'ameera! Database irratti save gochaa jira...");

          await db.collection("videos").add({
            videoUrl: data.secure_url,
            caption: caption,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            likes: 0
          });

          alert("Milkaa'ina: Vidiyoon kee post ta'eera!");
          location.reload();
        } else {
          alert("Error Cloudinary: " + (data.error ? data.error.message : JSON.stringify(data)));
        }
      } catch (err) {
        alert("Error: " + err.message);
      }
    }
  </script>
</body>
</html>
